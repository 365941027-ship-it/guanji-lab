name: Supabase Keep-Alive

on:
  schedule:
    # 每 2 天一次，防止免费档因 7 天无活动被自动暂停
    - cron: "0 4 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose network
        run: |
          echo "== getent vercel =="
          getent hosts guanji-lab.vercel.app || echo "DNS_FAIL vercel"
          echo "== curl vercel relay =="
          curl -s -o /dev/null -w "vercel=%{http_code}\n" --max-time 10 https://guanji-lab.vercel.app/api/keepalive || echo "CURL_FAIL vercel"
      - name: Ping Supabase via Vercel relay
        run: |
          curl -s -w "\nrelay_status=%{http_code}\n" --max-time 30 \
            "https://guanji-lab.vercel.app/api/keepalive"
