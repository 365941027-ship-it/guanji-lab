<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="assets/js/host-redirect.js"></script>
  <title>重置密码 · 观己实验室</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="assets/img/logo.svg" alt="观己实验室标志">
        <span class="brand-text">
          <span class="brand-name">观己实验室</span>
          <span class="brand-en">Self Insight Lab</span>
        </span>
      </a>
    </div>
  </header>
  <main>
    <section class="page-hero">
      <div class="container">
        <span class="kicker kicker-center">Reset Password</span>
        <h1>设置新密码</h1>
        <p>输入你的新密码，完成后即可重新登录。</p>
      </div>
    </section>
    <section class="section" style="padding-top:16px">
      <div class="container login-wrap">
        <div class="login-card">
          <div class="form-field">
            <label>新密码</label>
            <input type="password" id="newPass" placeholder="至少 6 位" autocomplete="new-password">
          </div>
          <button type="button" class="btn btn-gold btn-block" id="resetConfirm">保存新密码</button>
          <p class="login-note" id="resetMsg"></p>
        </div>
      </div>
    </section>
  </main>
  <script>
    // 内测期间改密码由我们人工处理：自助改密码需要邮件通道，等正式版再开。
    (function () {
      var btn = document.getElementById('resetConfirm');
      var input = document.getElementById('newPass');
      var msg = document.getElementById('resetMsg');
      btn.addEventListener('click', function () {
        var pass = input.value || '';
        if (pass.length < 8) { msg.textContent = '密码至少 8 位'; return; }
        msg.textContent = '内测期间暂不支持自助改密码。请把注册邮箱发给我们，我们会帮你重置，然后重新登录。';
      });
    })();
  </script>
</body>
</html>
