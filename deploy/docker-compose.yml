# 观己实验室 · 腾讯云部署（与 A股盯盘共用一台服务器）
# A股服务占 8235 端口；观己站默认 8787 端口，互不冲突。
#
# 用法：
#   cd /opt/guanji-lab
#   sudo bash deploy/install_guanji_docker.sh
#
# 首次部署前把 deploy/.env.example 复制为 /opt/guanji-lab/.env 并填入真实参数。
services:
  guanji:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: guanji-lab:latest
    container_name: guanji-lab
    restart: unless-stopped
    ports:
      - "8787:8787"
    # 直接读取项目根目录的 .env（相对本文件），所有密钥在容器内原样生效。
    # 这样即使忘记加 --env-file，变量也不会丢失 —— 之前踩过这个坑。
    env_file:
      - ../.env
    environment:
      # 只放不来自 .env 的固定值；此处若重复声明同名变量，会覆盖 env_file 的值。
      PORT: 8787
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data
