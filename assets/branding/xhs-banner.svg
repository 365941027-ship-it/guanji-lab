<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-label="观己实验室 小红书主页背景">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#fdfbf4"/>
      <stop offset="55%" stop-color="#f7f1e3"/>
      <stop offset="100%" stop-color="#efe7d3"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#fffdf6" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#fffdf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldBreath" cx="50%" cy="56%" r="38%">
      <stop offset="0%" stop-color="rgba(212,175,118,.20)"/>
      <stop offset="100%" stop-color="rgba(212,175,118,0)"/>
    </radialGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8b987"/>
      <stop offset="100%" stop-color="#c2a06c"/>
    </linearGradient>
  </defs>

  <!-- 米白纸感渐变，整幅铺满 -->
  <rect width="1080" height="1920" fill="url(#paper)"/>
  <rect width="1080" height="1920" fill="url(#glowTop)"/>
  <circle cx="540" cy="980" r="700" fill="url(#goldBreath)"/>

  <!-- 极细金色发丝圆：似有似无，留白感 -->
  <g fill="none" stroke="url(#hairline)" opacity=".42">
    <circle cx="540" cy="960" r="520" stroke-width="1"/>
    <circle cx="540" cy="960" r="660" stroke-width=".6" opacity=".7" stroke-dasharray="1 7"/>
    <circle cx="540" cy="960" r="392" stroke-width=".5" opacity=".5"/>
  </g>

  <!-- 几粒柔光星点，不构成 logo -->
  <g fill="#d6b276" opacity=".5">
    <circle cx="430" cy="380" r="2.6"/>
    <circle cx="690" cy="1560" r="2.6"/>
    <circle cx="842" cy="560" r="1.8"/>
    <circle cx="250" cy="1360" r="1.8"/>
  </g>

  <!-- 一条若有若无的斜弧线，像呼吸/地平线 -->
  <path d="M-80 1430 Q 260 1210 620 1245 T 1160 1180"
        fill="none" stroke="#d8b987" stroke-width="1.1" opacity=".34"/>
  <path d="M-80 1480 Q 260 1255 620 1290 T 1160 1222"
        fill="none" stroke="#cbb083" stroke-width=".5" opacity=".18"/>
</svg>
